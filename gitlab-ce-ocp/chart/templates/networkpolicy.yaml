{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitlab-ce-ocp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-ce-ocp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gitlab-ce-ocp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow the OpenShift router (haproxy) to reach GitLab.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 80
    # Allow SSH from anywhere inside the cluster (tighten as needed).
    - ports:
        - protocol: TCP
          port: 22
{{- end }}
