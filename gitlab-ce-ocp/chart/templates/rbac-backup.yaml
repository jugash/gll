{{- if .Values.backup.enabled }}
{{- /* The backup CronJob execs into the GitLab pod; grant just that. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gitlab-ce-ocp.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-ce-ocp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gitlab-ce-ocp.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-ce-ocp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gitlab-ce-ocp.fullname" . }}-backup
subjects:
  - kind: ServiceAccount
    name: {{ include "gitlab-ce-ocp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
