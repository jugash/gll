{{- /*
Only create a chart-managed secret for values provided inline. Where an
existingSecret is referenced, we consume that instead (see statefulset env).
*/ -}}
{{- $createRoot := and .Values.gitlab.rootPassword.value (not .Values.gitlab.rootPassword.existingSecret) -}}
{{- if $createRoot }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab-ce-ocp.fullname" . }}-root
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-ce-ocp.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.gitlab.rootPassword.value | quote }}
{{- end }}
