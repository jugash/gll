{{- /* Credential secrets consumed by both the datastores and the GitLab CR. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
# basic-auth so CloudNativePG can consume it as the initdb owner credential;
# the GitLab CR reads the `password` key.
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ include "deps.postgresPassword" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "deps.redisPassword" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-objectstore
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
type: Opaque
stringData:
  accesskey: {{ .Values.minio.accessKey | quote }}
  secretkey: {{ include "deps.minioSecretKey" . | quote }}
{{- if .Values.railsStorageSecret.enabled }}
---
{{- /*
The cloud-native GitLab chart reads a single `connection` key containing the
rails/fog S3 settings. This wires GitLab object storage at MinIO.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.railsStorageSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection: |
    provider: AWS
    region: {{ .Values.railsStorageSecret.region }}
    aws_access_key_id: {{ .Values.minio.accessKey }}
    aws_secret_access_key: {{ include "deps.minioSecretKey" . }}
    endpoint: "http://gitlab-minio.{{ .Release.Namespace }}.svc.cluster.local:9000"
    path_style: true
{{- end }}
