{{- if .Values.minio.enabled }}
{{- /*
MinIO S3-compatible object storage (AGPL-3.0, free). MinIO runs fine as an
arbitrary non-root UID under `restricted-v2` with an fsGroup on its data dir.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: gitlab-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
spec:
  selector: { app: gitlab-minio }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
spec:
  serviceName: gitlab-minio
  replicas: 1
  selector:
    matchLabels: { app: gitlab-minio }
  template:
    metadata:
      labels:
        app: gitlab-minio
        {{- include "deps.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: gitlab-objectstore, key: accesskey }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitlab-objectstore, key: secretkey }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
---
{{- /* Create the required buckets with the MinIO client (idempotent). */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-minio-buckets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: gitlab-minio-buckets }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://gitlab-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 5
              done
              for b in {{ join " " .Values.minio.buckets }}; do
                mc mb --ignore-existing "local/$b"
              done
              echo "buckets ready"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: gitlab-objectstore, key: accesskey }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitlab-objectstore, key: secretkey }
{{- end }}
