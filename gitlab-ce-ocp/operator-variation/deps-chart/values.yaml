# =============================================================================
# gitlab-deps-ocp — in-cluster dependencies for the GitLab Operator
# =============================================================================
# GitLab removed the bundled Redis/PostgreSQL/MinIO subcharts in 19.0 (chart
# 10.0). The Operator therefore expects EXTERNAL datastores. This chart provides
# those datastores IN-CLUSTER as first-class, independently-managed workloads,
# and emits the exact Secrets the GitLab CR references.
#
# IMAGE / LICENSE NOTE
# The Bitnami public catalog was deleted on 2025-09-29; versioned tags now live in
# the unmaintained `bitnamilegacy` repo, and hardened images are paid (Bitnami
# Secure Images). This chart therefore uses license-clean, OpenShift-native,
# actively-maintained images instead:
#   - PostgreSQL : CloudNativePG (Apache-2.0) — needs the CNPG operator installed
#   - Redis      : Valkey (BSD-3, the open Redis fork)
#   - Object     : MinIO (AGPL-3.0, free) — or OpenShift Data Foundation for prod
# All run under OpenShift's default `restricted-v2` SCC; no custom SCC for deps.
# =============================================================================

global:
  # Namespace note: install this chart into the SAME namespace as the GitLab CR.
  # Secret names below are what ../gitlab-cr.yaml expects — keep them in sync.
  storageClass: ""          # "" = cluster default; use RWO block (e.g. ODF Ceph RBD)

# -----------------------------------------------------------------------------
# PostgreSQL — in-cluster StatefulSet (default) or CloudNativePG (optional HA)
# -----------------------------------------------------------------------------
# Default `mode: statefulset` runs a single-primary Postgres StatefulSet using the
# Red Hat sclorg image, which is purpose-built to run under OpenShift's default
# `restricted-v2` SCC with an arbitrary UID (the official docker `postgres` image
# does NOT — it fails UID resolution). It's maintained and free.
#   CR points at service `gitlab-postgresql`.
#
# Optional `mode: cnpg` emits a CloudNativePG Cluster instead for HA with
# auto-failover (requires the CloudNativePG operator). CR points at
# `gitlab-postgresql-rw`. See docs for the switch.
postgresql:
  enabled: true
  mode: statefulset          # statefulset | cnpg
  # StatefulSet mode image — OpenShift arbitrary-UID friendly, free.
  # Alternatives: registry.redhat.io/rhel9/postgresql-16 (supported, needs RH pull secret).
  image: "quay.io/sclorg/postgresql-16-c9s:latest"
  database: "gitlabhq_production"
  username: "gitlab"
  # App-user password in secret `gitlab-postgresql` (key: password). Auto-gen if empty.
  password: ""
  # Superuser password (key: postgres-password) — used to create GitLab's required
  # extensions. Auto-generated if empty.
  adminPassword: ""
  # CloudNativePG-only settings (mode: cnpg)
  cnpg:
    instances: 3             # 1 primary + 2 replicas w/ automatic failover
    imageName: "ghcr.io/cloudnative-pg/postgresql:16"
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits:   { cpu: "2", memory: "4Gi" }
  persistence:
    size: 50Gi

# -----------------------------------------------------------------------------
# Redis / Valkey  (GitLab is wire-compatible with both)
# -----------------------------------------------------------------------------
# engine selects which server to run and which binaries the template calls:
#   valkey -> valkey-server / valkey-cli   (BSD-3, permissive; default)
#   redis  -> redis-server  / redis-cli    (Redis 8+ offers an AGPLv3 option)
# Both run under OpenShift `restricted-v2` with an fsGroup (no uid resolution needed).
redis:
  enabled: true
  engine: valkey             # valkey | redis
  # Leave `image` empty to use the engine default, or pin your own.
  #   valkey default: valkey/valkey:8
  #   redis default : redis:8   (AGPLv3-licensed; use redis:7.4 for the older BSD line)
  image: ""
  # Password in secret `gitlab-redis` (key: password). Auto-generated if empty.
  password: ""
  # HA via Sentinel. The shipped template deploys a reliable single primary; set
  # this true ONLY when you have deployed HA Redis/Valkey via a Redis operator
  # (see docs) — it flips the GitLab CR wiring to Sentinel mode.
  sentinel:
    enabled: false
    masterName: "gitlab"
    replicas: 3
    hosts: []                # host:port endpoints for the CR when enabled
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1", memory: "2Gi" }
  persistence:
    size: 8Gi

# -----------------------------------------------------------------------------
# MinIO (S3-compatible object storage, AGPL-3.0 — still free)
# -----------------------------------------------------------------------------
# Provides object storage for artifacts, LFS, uploads, packages, registry and
# backups. For production at scale, prefer OpenShift Data Foundation (ODF/NooBaa)
# and set minio.enabled: false, then point the CR at ODF instead.
minio:
  enabled: true
  image: "quay.io/minio/minio:latest"
  mcImage: "quay.io/minio/mc:latest"          # client, used by the bucket-create Job
  # Access/secret keys stored in secret `gitlab-objectstore` (keys: accesskey/secretkey).
  accessKey: "gitlab"
  secretKey: ""              # auto-generated if empty
  # Buckets created by an init Job.
  buckets:
    - gitlab-artifacts
    - gitlab-lfs
    - gitlab-uploads
    - gitlab-packages
    - gitlab-registry
    - gitlab-backups
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2", memory: "4Gi" }
  persistence:
    size: 100Gi

# -----------------------------------------------------------------------------
# Object-storage connection secret rendered for the GitLab chart.
# The cloud-native chart reads a single `connection` key (rails S3 config).
# -----------------------------------------------------------------------------
railsStorageSecret:
  enabled: true
  name: "gitlab-rails-storage"     # referenced by the CR's global.appConfig.object_store
  region: "us-east-1"
